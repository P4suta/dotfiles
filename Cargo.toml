[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
# The repository settings tool ships inside a shared skill, so it keeps its own manifest and lockfile.
exclude = ["home"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The Git wrapper starts on every Git command, so it trades build time for a small, stripped binary.
[profile.release.package.dotguard]
opt-level = "s"
codegen-units = 1
strip = true
