[files]
# Vendored upstream schemas keep their upstream text.
# Schema pins and the upstream document manifest keep imported text byte-exact.
# The signed issue-context transport also contains opaque authenticated bytes.
# Binary fuzz corpus entries preserve malformed input bytes.
# The vendored Unihan code point list is hexadecimal numbers.
extend-exclude = [
  "data/unihan-jis-kanji.txt",
  ".git/",
  "schemas/vendor/",
  ".pr-workflow/contexts.json",
  "fuzz/corpus/",
  "xtask/schema/njutest/njutest-assurance-report-v1.json",
  "xtask/schema/njutest/rust-mutants-catalog-v1.json",
  "xtask/schema/njutest/rust-mutants-run-report-v1.json",
  "xtask/tests/fixtures/njutest/assurance.json",
  "xtask/tests/fixtures/njutest/catalog.json",
  "xtask/tests/fixtures/njutest/engine.json",
]
# Check hidden files.
ignore-hidden = false

[default]
# File names produce false positives.
check-filename = false

[default.extend-words]
tre = "tre"     # Tool name.
serie = "serie" # Tool name.

[type.rust]
# Windows command arguments and Alloy model extensions remain literal protocol text.
# The Cabinet mora table specifies these three pairs.
extend-ignore-re = [
  '"/fo"',
  '\.als\b',
  '\("ば", "ba"\)',
  '\("ぎゃ", "gya"\)',
  '\("みゅ", "myu"\)',
]
