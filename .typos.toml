
[files]
# Vendored upstream schemas keep their upstream text.
# Their sha256 pins in policy/obligations.toml keep them byte-exact.
extend-exclude = [".git/", "schemas/vendor/"]
# Check hidden files.
ignore-hidden = false

[default]
# File names produce false positives.
check-filename = false

[default.extend-words]
tre = "tre"     # Tool name.
serie = "serie" # Tool name.
