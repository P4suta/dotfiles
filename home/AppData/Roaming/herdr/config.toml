# Herdr settings for Windows, declaring only the defaults that fail on this host.

# The first-run wizard would overwrite this file.
onboarding = false

[terminal]
# Windows lacks the default shell paths.
default_shell = "pwsh"

[update]
# Matches [herdr].channel in .chezmoidata.toml, which herdrdev/herdr#4284 explains.
channel = "preview"

[ui]
# Japanese input places its IME candidate window at the native cursor.
host_cursor = "native"
