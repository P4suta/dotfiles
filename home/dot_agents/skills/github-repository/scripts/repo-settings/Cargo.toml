[package]
name = "repo-settings"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Audit, plan, apply, and verify personal GitHub repository governance"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
yaml-rust2 = "0.13"

[lints.rust]
unsafe_code = "forbid"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace]
