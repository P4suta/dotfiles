# Desktop, terminal, and keyboard settings of each profile.

[platforms.linux.desktop]
kitty_channel = "stable"
nerd_fonts_version = "v3.5.1"
opacity = "0.85"
zed_channel = "stable"

[platforms.linux.desktop.keyboard]
delay = 300
repeat_interval = 33

[platforms.mac.desktop]
blur = "macos-glass-regular"
font_family = "UDEV Gothic NFLG"
font_size = "14"
opacity = "0.85"
zed_channel = "stable"

[platforms.mac.macos.keyboard]
initial_key_repeat = 18
key_repeat = 2
press_and_hold = false

[platforms.windows.keyboard]
keyboard_delay = 0
keyboard_speed = 31

[platforms.windows.terminal]
font_family = "JetBrainsMono NF"
font_size = 11
max_fps = 120
multiplexer = "herdr"
opacity = 0.8
