# Services that only Windows sets up through dotctl.

[platforms.windows.herdr]
channel = "preview"
enabled = true
expected_build_id = ""
manifest_url = "https://herdr.dev/latest.json"
retain = 3
revision = "2026-09-23"

[platforms.windows.ocomment]
destination = "projects/github.com/P4suta/OComment"
