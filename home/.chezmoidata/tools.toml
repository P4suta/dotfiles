# Tools mise installs on each profile, and how many it builds at once.
# `shared_tools.common` installs on every profile, and a profile leaves one out only through a `shared_tools.skip` entry that states why.
# Each profile's own `common` adds what only that profile needs, and `personal` and `work` follow the machine's role.
# versions.toml holds their pinned versions.

[shared_tools]
common = [
  "rust",
  "go",
  "node",
  "bun",
  "uv",
  "java",
  "erlang",
  "gleam",
  "rebar",
  "aqua:pnpm/pnpm",
  "golangci-lint",
  "cargo:cargo-semver-checks",
  "github:github/gh-stack",
]

[platforms.linux.mise]
jobs = 2

[platforms.linux.tools]
common = [
  "opam",
  "google-java-format",
  "gradle",
  "jbang",
  "maven",
  "mvnd",
  "go:github.com/go-delve/delve/cmd/dlv",
  "go:golang.org/x/tools/gopls",
  "go:golang.org/x/vuln/cmd/govulncheck",
  "go:honnef.co/go/tools/cmd/staticcheck",
  "go:mvdan.cc/gofumpt",
]
personal = []
work = []

[platforms.mac.mise]
jobs = 8

[platforms.mac.tools]
common = [
  "ghc",
  "opam",
  "racket",
  "cabal",
  "google-java-format",
  "gradle",
  "jbang",
  "maven",
