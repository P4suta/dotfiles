  "go:honnef.co/go/tools/cmd/staticcheck",
  "npm:repomix",
  "air",
  "aqua:dlvhdr/gh-dash",
  "aqua:wader/fq",
  "cargo:cargo-machete",
  "mvnd",
  "process-compose",
  "usql",
  "doppler",
]
personal = []
work = []

[platforms.windows.tools]
common = [
