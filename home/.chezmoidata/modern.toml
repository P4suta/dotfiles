[[modern.tools]]
legacy = ["xq", "tomlq"]
preferred = "yq"
tool = "yq"
# renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v(?<version>.+)$
version = "4.54.1"
reason = "One tool queries YAML, TOML, and XML."
keep = "None."
next = "yq {args}"

[[modern.tools]]
legacy = ["curl", "wget"]
preferred = "xh"
tool = "xh"
# renovate: datasource=github-releases depName=ducaale/xh extractVersion=^v(?<version>.+)$
version = "0.26.3"
reason = "It prints readable requests and responses."
keep = "A script that depends on curl's exact behavior, such as a download that a checksum verifies."
next = "xh {args}"

[[modern.tools]]
legacy = ["xxd", "hexdump", "od"]
preferred = "hexyl"
tool = "hexyl"
# renovate: datasource=github-releases depName=sharkdp/hexyl extractVersion=^v(?<version>.+)$
version = "0.17.0"
reason = "It prints a readable view of binary data."
keep = "A caller that reverses the dump with `xxd -r`."
next = "hexyl {args}"

[[modern.tools]]
legacy = ["wc"]
when = ["-l", "--lines"]
stream = true
preferred = "tokei"
tool = "cargo:tokei"
# renovate: datasource=github-releases depName=XAMPPRocky/tokei extractVersion=^v(?<version>.+)$
version = "15.0.0"
reason = "It counts code, comments, and blanks per language instead of raw lines."
keep = "Counting the lines of a stream that holds no code."
next = "tokei for code, or `rg -c ''` for the lines of other files"

[[modern.tools]]
legacy = ["time"]
preferred = "hyperfine"
tool = "hyperfine"
# renovate: datasource=github-releases depName=sharkdp/hyperfine extractVersion=^v(?<version>.+)$
version = "1.21.0"
reason = "It repeats runs and reports statistics, so a comparison survives noise."
keep = "Timing one run whose output you also need."
next = "hyperfine '{args}'"

[[modern.tools]]
legacy = ["man"]
preferred = "tldr"
tool = "tealdeer"
# renovate: datasource=github-releases depName=tealdeer-rs/tealdeer extractVersion=^v(?<version>.+)$
version = "1.9.1"
reason = "It shows short examples, and `--help` stays the authority."
keep = "Reading a full manual section."
next = "`{args} --help`, or tldr {args}"

[[modern.tools]]
legacy = ["tar", "unzip", "zip", "gzip", "gunzip"]
preferred = "ouch"
tool = "github:ouch-org/ouch"
# renovate: datasource=github-releases depName=ouch-org/ouch
version = "0.8.3"
reason = "One command compresses and extracts every archive format."
keep = "A POSIX script that runs before provisioning, or `git archive` piped into tar."
next = "`ouch decompress <archive>` or `ouch compress <files> <archive>`"

# Scripts that run before mise provisions the preferred tools, so they keep the legacy tools.
[[modern.tools]]
legacy = []
preferred = "delta"
tool = "delta"
# renovate: datasource=github-releases depName=dandavison/delta
version = "0.20.1"
reason = "It renders structural Git diffs as the pager on every host."
keep = "Git produces its own patch bytes before the pager runs."
next = "delta {args}"

# The hook reads a script a command runs and refuses its legacy commands unless this list names that script.

[[modern.exceptions]]
path = "home/.chezmoitemplates/partials/install-mise-sh"
reason = "It installs mise itself, so no preferred tool exists yet."

[[modern.exceptions]]
path = "home/.chezmoiscripts/unix/run_before_00-mise.sh.tmpl"
reason = "It runs the mise installation before any preferred tool exists."

