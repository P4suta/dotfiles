# The tool versions that mise installs on each profile, and the mise release itself.
# Renovate proposes each update as a pull request, after the release has aged, and no host rewrites these pins on its own.
# A `renovate:` comment names where Renovate looks up the next version of the pin below it.
# A channel such as `stable` or `temurin-25` follows its own releases and carries no comment.

# The mise launcher installs this release before any other step and refuses an asset whose SHA-256 differs.
# A version update takes every checksum from the release's SHASUMS256.txt.
[mise]
# renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
version = "2026.10.6"

[mise.sha256]
linux-arm64 = "5f3187febbe9ff98e4c78b3596c7bbfde0e3ef8e4b1820494d03efd499de7b6e"
linux-x64 = "3f44343eebc7e0d6623bcea46e304864f02dff648edd75c82871b53cc697b366"
macos-arm64 = "bbcea7b0f844d026424a4c8335357a15a2f5c9e9132c9408de990d9be6f26101"
macos-x64 = "70e1407e2fdc7a19f94db35745a8e5885b0e4bbdbfb34bfb7e3619d6230a8f70"
windows-x64 = "c586696608dae5538e49b91cc728d3d525ba02a48c9200327694003dbde3b0a4"

[platforms.linux.tool_versions]
java = "temurin-25"
rust = "stable"

[platforms.mac.tool_versions]
# renovate: datasource=github-tags depName=haskell/cabal extractVersion=^cabal-install-v(?<version>.+)$
cabal = "3.16.1.0"
# renovate: datasource=github-tags depName=ghc/ghc extractVersion=^ghc-(?<version>.+)-release$
ghc = "9.14.1"
# renovate: datasource=github-releases depName=haskell/haskell-language-server
haskell-language-server = "2.15.0.0"
java = "temurin-25"
# renovate: datasource=github-tags depName=racket/racket extractVersion=^v(?<version>.+)$
racket = "9.3"
rust = "stable"
