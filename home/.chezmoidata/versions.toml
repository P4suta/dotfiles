# The tool versions that mise installs on each profile, and the mise release itself.
# Renovate proposes each update as a pull request, after the release has aged, and no host rewrites these pins on its own.
# A `renovate:` comment names where Renovate looks up the next version of the pin below it.
# A channel such as `stable` or `temurin-25` follows its own releases and carries no comment.

# The mise launcher installs this release before any other step and refuses an asset whose SHA-256 differs.
# A version update takes every checksum from the release's SHASUMS256.txt.
[mise]
# renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
version = "2026.11.14"

[mise.sha256]
linux-arm64 = "86ef275d541c5243cd20b1c0fcd16810e5f3601113d8db09278d0608617a3833"
linux-x64 = "b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9"
macos-arm64 = "3f4ba9d21c6f2170048d0870fd98ab287e04730b76a6fc8e83964d59c80eb704"
macos-x64 = "7eab8054d301b75dcbd93440ff184bee6864d95799cfdc4a00ce858313b68783"
windows-x64 = "9dc997718aa70280c344dd197b6d8e2315eef71604a94c24e5e07c2d09489693"

# The versions of the shared tools on every profile, unless a profile's own `tool_versions` names another.
[shared_tools.versions]
shellcheck = "0.11.0"
shfmt = "3.14.1"
ruff = "0.17.5"
biome = "2.6.8"
actionlint = "1.7.12"
zizmor = "1.32.0"
taplo = "0.10.0"
hadolint = "2.15.1"
just = "1.59.0"
java = "temurin-25"
rust = "stable"
# renovate: datasource=github-releases depName=github/gh-stack
"github:github/gh-stack" = "v0.3.0"
# renovate: datasource=github-releases depName=terrastruct/d2 extractVersion=^v(?<version>.+)$
"aqua:terrastruct/d2" = "0.9.0"
# renovate: datasource=github-releases depName=charmbracelet/freeze extractVersion=^v(?<version>.+)$
"aqua:charmbracelet/freeze" = "0.2.2"
# renovate: datasource=pypi depName=shot-scraper
"pipx:shot-scraper" = "1.12"

[platforms.linux.tool_versions]

[platforms.mac.tool_versions]
# renovate: datasource=github-tags depName=haskell/cabal extractVersion=^cabal-install-v(?<version>.+)$
cabal = "3.16.1.0"
# renovate: datasource=github-tags depName=ghc/ghc extractVersion=^ghc-(?<version>.+)-release$
ghc = "9.14.1"
# renovate: datasource=github-releases depName=haskell/haskell-language-server
haskell-language-server = "2.15.0.0"
# renovate: datasource=github-tags depName=racket/racket extractVersion=^v(?<version>.+)$
racket = "9.3"
