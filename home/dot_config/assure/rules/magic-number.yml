id: magic-number
language: rust
severity: error
message: An unnamed number carries a meaning that its code doesn't name.
note: Name the value in a const beside its use or in the crate's constants module, and use the name.
metadata:
  cwe: CWE-1106
  ruleset: SEI CERT DCL06-C
ignores:
  - "**/tests/**"
  - "**/benches/**"
rule:
  any:
    - kind: integer_literal
      not:
        regex: '^[01](_?[iu](8|16|32|64|128|size))?$'
    - kind: float_literal
  not:
    any:
      - matches: verification-only
      - inside:
          stopBy: end
          any:
            - kind: const_item
            - kind: static_item
            - kind: attribute_item
            - kind: enum_variant
            - kind: array_type
      - inside:
          kind: array_expression
          field: length
      - inside:
          kind: field_expression
          field: field
