id: version-label
valid:
  - "fn note_id() -> uuid::Uuid { uuid::Uuid::now_v7() }"
  - "use uuid::Uuid; fn note_id() -> Uuid { Uuid::now_v7() }"
  - "fn ipv6_prefix(address: u128) -> u128 { address }"
  - "const IPV4_VERSION: u8 = 4;"
  - "const NON_PUBLIC_V4: &[u32] = &[];"
  - "fn in_v6(address: u128) -> bool { address > 0 }"
  - "struct FeedPoller { url: String }"
  - "fn on_demand_fetch() {}"
  - "const V2_HEADER_BYTES: usize = 60; fn header() -> usize { V2_HEADER_BYTES }"
  - "const V3_NAME_LENGTH_OFFSET: usize = 72; fn offset() -> usize { V3_NAME_LENGTH_OFFSET }"
  - "const V2_NAME_OFFSET_FIELD: usize = 58;"
  - "const V2_VERSION: u16 = 2; fn version() -> u16 { V2_VERSION }"
  - "use windows_sys::Win32::System::Ioctl::{READ_USN_JOURNAL_DATA_V0, USN_JOURNAL_DATA_V0}; fn size() -> usize { size_of::<USN_JOURNAL_DATA_V0>() }"
  - "use windows_sys::Win32::System::Ioctl::USN_JOURNAL_DATA_V0; fn decode() -> USN_JOURNAL_DATA_V0 { todo!() }"
  - "use sdk::RECORD_V2; fn encode() { let record = RECORD_V2 { size: 0 }; }"
  - "use sdk::FeedV2; fn decode() -> FeedV2 { todo!() }"
  - "use sdk::FeedV2 as Feed; fn decode() -> Feed { todo!() }"
  - "#[cfg(test)] mod tests { fn compare() { let workspace_v1 = 1; let workspace_v2 = 2; } }"
  - "#[test] fn compare() { let workspace_v1 = 1; }"
invalid:
  - "fn now_v7() {}"
  - "fn create_note_v7() {}"
  - "fn create() { Document::now_v7(); }"
  - "fn fetch_v2() {}"
  - "struct FeedV2 { url: String }"
  - "const API_V2: &str = \"items\";"
  - "fn v3Handler() {}"
  - "const SCHEMA_V10: u8 = 10;"
  - "const V2_CACHE_LIMIT: usize = 60;"
  - "const V2_HEADER_BYTES: &str = \"header\";"
  - "fn header(V2_HEADER_BYTES: usize) -> usize { V2_HEADER_BYTES }"
  - "const V3_HEADER_BYTES: usize = 76; fn header(V2_HEADER_BYTES: usize) -> usize { V2_HEADER_BYTES }"
  - "const V2_HEADER_BYTES: usize = 60; mod local { const V2_HEADER_BYTES: &str = \"header\"; }"
  - "const V2_HEADER_BYTES: usize = 60; mod local { fn V2_HEADER_BYTES() {} }"
  - "const V2_HEADER_BYTES: usize = 60; mod local { fn header(V2_HEADER_BYTES: usize) -> usize { V2_HEADER_BYTES } }"
  - "fn encode() { let record = RECORD_V2 { size: 0 }; }"
  - "use sdk::Feed as FeedV2;"
  - "struct USN_JOURNAL_DATA_V0 { cursor: u64 }"
  - "use sdk::FeedV2; mod local { struct FeedV2 { url: String } }"
  - "#[cfg(feature = \"test-tools\")] mod helpers { fn fetch_v2() {} }"
  - "#[cfg(test)] mod tests {} fn fetch_v2() {}"
