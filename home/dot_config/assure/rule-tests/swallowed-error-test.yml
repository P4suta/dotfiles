id: swallowed-error
valid:
  - "fn clean(path: &Path) -> io::Result<()> { fs::remove_file(path) }"
  - "fn clean(path: &Path) -> io::Result<()> { match fs::remove_file(path) { Err(error) if error.kind() == io::ErrorKind::NotFound => Ok(()), other => other } }"
  - "fn unused(value: u8) { let _unused = value; }"
  - "fn unused(value: u8) { let _ = value; }"
invalid:
  - "fn clean(path: &Path) { let _ = fs::remove_file(path); }"
  - "fn clean(path: &Path) { fs::remove_file(path).ok(); }"
  - "fn clean(path: &Path) { match fs::remove_file(path) { Ok(()) => {} Err(_) => {} } }"
  - "fn clean(path: &Path) { if let Err(_) = fs::remove_file(path) {} }"
