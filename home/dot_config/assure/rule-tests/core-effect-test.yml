id: core-effect
valid:
  - "pub fn fault(bytes: &[u8]) -> Option<Fault> { decide(bytes) }"
  - "use core::fmt;"
  - "#[cfg(test)]\nmod tests { fn fixture() { std::fs::read(\"a\").ok(); } }"
invalid:
  - "pub fn fault(path: &Path) -> Option<Fault> { decide(&std::fs::read(path).ok()?) }"
  - "use std::fs;"
  - "use std::{collections::BTreeMap, env};"
  - "fn now() -> u64 { std::time::SystemTime::now().elapsed().map_or(0, |d| d.as_secs()) }"
  - "fn roll() -> u8 { rand::random() }"
