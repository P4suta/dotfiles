id: magic-number
valid:
  - "const RETRIES: u32 = 3;\nfn retries() -> u32 { RETRIES }"
  - "fn next(index: usize) -> usize { index + 1 }"
  - "fn empty() -> usize { 0 }"
  - "fn buffer() -> [u8; 16] { [0; 16] }"
  - "#[kani::unwind(10)]\nfn harness() {}"
  - "#[cfg(test)]\nmod tests { #[test] fn three() { assert_eq!(1 + 2, 3); } }"
  - "#[cfg(any(test, kani))]\nmod proofs { pub fn spec(count: u64) { assert!(count * 25 <= 18); } }"
  - "enum Code { Missing = 2 }"
  - "fn third(tuple: (u8, u8, u8)) -> u8 { tuple.2 }"
  - "fn pairs(items: &[u8]) -> usize { items.windows(2).count() }"
  - "fn half(value: f64) -> f64 { value / 2.0 }"
  - "fn origin() -> (f32, f32) { (0.0, 1.0) }"
  - "fn buffer() -> Vec<u8> { Vec::with_capacity(64) }"
  - "fn blocks(bytes: &[u8]) -> usize { bytes.chunks_exact(16).count() }"
  - "fn head(items: &[u8]) -> Vec<u8> { items.iter().copied().take(8).collect() }"
  - "fn limit() -> usize { 64 * 1024 }"
  - "fn kibibytes(bytes: usize) -> usize { bytes / 1024 * 1024 }"
invalid:
  - "fn retries() -> u32 { 3 }"
  - "fn wait(seconds: u64) -> u64 { seconds * 1000 }"
  - "fn ratio(value: f64) -> f64 { value * 0.8 }"
  - "fn lead(byte: u8) -> bool { byte & 0xC0 == 0x80 }"
  - "fn sign(byte: u8) -> bool { byte & 128 == 128 }"
  - "fn buffer() -> Vec<u8> { Vec::with_capacity(100) }"
  - "fn limit() -> usize { 64 + 1024 }"
  - "fn scale(value: f64) -> f64 { value * 3.0 }"
