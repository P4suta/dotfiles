# Repository rules for Japanese replies, which Vale never reads.
[rules."Dotfiles.Attribution"]
message = "State the change itself instead of who asked for it."
tokens = [
  "ご依頼",
  "ご要望",
  "ご指示",
  "ご指摘どおり",
  "ご指摘通り",
  "依頼どおり",
  "依頼通り",
  "指示どおり",
  "指示通り",
  "要望どおり",
  "要望通り",
  "おっしゃる通り",
  "仰る通り",
  "リクエストどおり",
  "リクエスト通り",
]

[rules."Dotfiles.VersionLabel"]
message = "Name the design by its decision or the release by its product and number instead of a bare version label."
tokens = ["v1", "v2", "v3", "V1", "V2", "V3"]

[rules."Dotfiles.FigurativeJargon"]
message = "Name the actual limit, list, or state instead of a translated metaphor."
tokens = ["窓から外れ", "窓に載", "窓に入", "窓の外", "窓の中"]

[rules."Dotfiles.ForeignTerm"]
message = "Write the Japanese term instead of a Chinese technical term."
tokens = [
  "快照",
  "缓存",
  "默认",
  "运行",
  "错误",
  "网络",
  "用户",
  "数据",
  "请求",
  "返回",
  "删除",
  "变更",
]

[rules."Dotfiles.Hedging"]
message = "State the fact or its condition without the hedge."
tokens = ["かもしれません", "かもしれない", "と思います", "と思われます", "おそらく", "たぶん", "多分", "気がします"]

# The conjunction that begins with this particle, and its longer form, are words of their own.
# The polite verb itadakeru contains the particle's characters, so its forms stay allowed, while a past verb before the particle still counts.
[rules."Dotfiles.Restriction"]
message = "State the scope itself affirmatively, such as what the statement covers, instead of narrowing it with だけ."
tokens = ["だけ"]
except = ["だけど", "だけれど", "いただける", "いただけれ", "いただけま", "いただけて", "いただけない", "いただけた"]
