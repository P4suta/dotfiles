extends: existence
message: "Address the user directly or state the action without an ownership label: '%s'."
level: error
ignorecase: true
nonword: true
scope: ~text.blockquote
tokens:
  - '\bthe\s+owner\s+(?:(?:has|had|can|could|may|must|will|would|should|does|did|explicitly|already)\s+)*(?:asks?|asked|requests?|requested|chose|chooses|confirms?|confirmed|approves?|approved|authorizes?|authorized|decides?|decided|prefers?|preferred|wants?|wanted|says|said)\b'
  - '\bowner(?:[''’]s)?[-\s]+(?:approval|acceptance|authorization|confirmation|consent|decision|permission|request|instructions?|policy|preference|approved|authorized|requested|imposed|managed|provided)\b'
  - '\bowner(?:様|さん)?(?:に|へ|の|は|が|を|から|と)'
  - 'オーナー(?:様|さん)?'
  - '所有者(?:様|さん)'
  - '所有者の(?:承認|許可|確認|指示|依頼|判断)'
