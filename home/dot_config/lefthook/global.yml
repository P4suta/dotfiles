# Rust hook dispatchers select this configuration with LEFTHOOK_CONFIG before the repository's own gates.

output:
  - failure

pre-commit:
  parallel: false
  commands:
    issue-context:
      run: pr-workflow change-check --staged
    prose-sembr:
# Fix staged additions in place and keep partial staging.
      glob: "*"
      run: ocomment fix --tidy --staged {staged_files}
