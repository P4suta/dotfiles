{{- /* chezmoi:modify-template */ -}}
{{- /*
  Codex records project trust and other machine state in this file, so every profile owns only the keys set here.
  Persistent agent memory stays off; docs/agent-memory-migration.md records where its former content lives.
*/ -}}
{{- $current := dict -}}
{{- if trim .chezmoi.stdin -}}{{- $current = fromToml .chezmoi.stdin -}}{{- end -}}
{{- range list "features.memories" "features.external_agent_memory_import" "features.chronicle" "memories.generate_memories" "memories.use_memories" -}}
{{- $current = setValueAtPath . false $current -}}
{{- end -}}
{{- $tool := joinPath .chezmoi.homeDir ".local/bin/dotfiles" -}}
{{- if has .profile (list "mac" "linux") -}}
{{- $socket := or (dig "ssh_signing" "socket" "" .) (index .ssh_signing (printf "%s_socket" .profile)) -}}
{{- if hasPrefix "~/" $socket -}}{{- $socket = joinPath .chezmoi.homeDir (trimPrefix "~/" $socket) -}}{{- end -}}
{{- $current = setValueAtPath "shell_environment_policy.set.GIT_SSH_COMMAND" "/usr/bin/ssh" $current -}}
{{- $current = setValueAtPath "shell_environment_policy.set.SSH_AUTH_SOCK" $socket $current -}}
{{- end -}}
{{- if eq .profile "windows" -}}
{{- $tool = printf "%s.exe" $tool -}}
{{- $current = setValueAtPath "features.prefer_mxc" true $current -}}
{{- end -}}
{{- $previous := dig "notify" (list) $current -}}
{{- if kindIs "slice" $previous -}}
{{- $notify := includeTemplate "partials/codex_notify" (dict "tool" $tool "previous" $previous) | fromJson -}}
{{- $current = setValueAtPath "notify" $notify $current -}}
{{- end -}}
{{ toToml $current | trim }}
