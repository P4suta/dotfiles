    assert!(gates(classify(path)) != Gates::ALL);
}
#[kani::proof]
#[kani::unwind(40)]
fn reject_a_lock_file_selecting_a_single_class() {
    let mut bytes: [u8; 24] = kani::any();
    bytes[19..].copy_from_slice(b".lock");
    assert!(classify(&bytes) != Class::Everything);
}
'''

