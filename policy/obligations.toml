use production::{Answer, Move, Store, gate, review_complete, safe, step};
#[kani::proof]
fn reject_a_stop_allowed_with_an_undecided_draft() {
    let mut state = gate();
    state.draft = Some(1);
    state.answer = Answer::Allow;
    assert!(safe(&state));
}
#[kani::proof]
fn reject_a_second_maintenance_request() {
    let mut state = gate();
    state.requests = 2;
    assert!(safe(&state));
}
#[kani::proof]
#[kani::unwind(9)]
fn reject_a_triage_between_two_analyses_standing_in_for_the_newer_draft() {
    let mut state = gate();
    for action in [Move::Observe, Move::Analyze, Move::Check(0), Move::Observe, Move::Analyze, Move::Record(0), Move::Stop] {
        state = step(Store::Old, state, action).unwrap_or(state);
    }
    assert!(safe(&state));
}
#[kani::proof]
fn reject_the_fixed_triage_of_a_stale_draft() {
    let mut state = gate();
    state.events = 1;
    state.draft = Some(0);
    assert!(step(Store::Fixed, state, Move::Triage).is_some());
}
#[kani::proof]
fn reject_an_incomplete_decision_completing_the_review() {
    assert_eq!(review_complete(true, &[(0, false)], &[(0, false)]), Ok(()));
}
'''

