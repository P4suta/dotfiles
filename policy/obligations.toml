[[obligation]]
verifier = "kani"
source = "crates/rules/src/host_setup_rules.rs"
probes = '''
use production::{FilterKeys, authorized_keys, disable_managed_filter_keys, looks_like_stub, powershell_literal, sshd_config, stale_releases};
#[kani::proof]
#[kani::unwind(40)]
fn reject_a_second_sshd_edit_changing_the_result() { let first = sshd_config("Port 22\n", &[("Port", "23")]); assert_ne!(sshd_config(first.as_str(), &[("Port", "23")]).as_str(), first.as_str()); }
#[kani::proof]
#[kani::unwind(40)]
fn reject_overwriting_a_prefixed_keyword() { assert!(!sshd_config("PortExtra 22\n", &[("Port", "23")]).as_str().contains("PortExtra 22")); }
#[kani::proof]
#[kani::unwind(40)]
fn reject_duplicating_a_key_with_a_new_comment() { assert_eq!(authorized_keys("t a old\n", "t a new").as_str(), "t a old\nt a new\n"); }
#[kani::proof]
#[kani::unwind(20)]
fn reject_removing_the_current_release() { assert!(stale_releases(&[("a", 0), ("b", 1)], 1, "a").contains(&"a")); }
#[kani::proof]
fn reject_changing_a_persons_keyboard_settings() { let keys = FilterKeys { flags: 3, wait_ms: 10, delay_ms: 150, repeat_ms: 15, bounce_ms: 0 }; assert!(disable_managed_filter_keys(keys).is_some()); }
#[kani::proof]
fn reject_removing_a_nonempty_interpreter() { assert!(looks_like_stub(1, production::REPARSE_POINT)); }
#[kani::proof]
#[kani::unwind(12)]
fn reject_colliding_distinct_powershell_literals() { assert_eq!(powershell_literal("a'").as_str(), powershell_literal("a''").as_str()); }
'''

