#:schema ../schemas/obligations.schema.json
# Every verification obligation of this repository, which `just proofs` discharges and `just check` holds to the source.
# Each rule module of crates/rules has one Kani obligation: every harness `kani list` finds in it must pass, and every harness in `probes` must fail on an assertion.
# The probes follow `mod production;`, which names the module under proof.
# A public function of a rule module needs a harness that mentions it or an exemption in its documentation, as docs/adr/checked-obligation-manifest.md describes.

[[obligation]]
verifier = "kani"
source = "crates/rules/src/phase_receipt_rules.rs"
probes = '''
#[kani::proof]
fn reject_an_untrusted_cache_claiming_success() {
    assert!(production::disposition(true, production::Evidence::Untrusted, false) == production::Disposition::Reuse);
}
#[kani::proof]
fn reject_an_incomplete_cache_claiming_success() {
    assert!(production::disposition(true, production::Evidence::Incomplete, false) == production::Disposition::Reuse);
}
#[kani::proof]
fn reject_an_incompatible_cache_claiming_success() {
    assert!(production::disposition(true, production::Evidence::Incompatible, false) == production::Disposition::Reuse);
}
#[kani::proof]
fn reject_a_failed_attempt_reviving_previous_success() {
    assert!(production::disposition(true, production::Evidence::Verified, true) == production::Disposition::Reuse);
}
#[kani::proof]
fn reject_an_unauthorized_producer_claiming_success() {
    assert!(production::disposition(false, production::Evidence::Verified, false) == production::Disposition::Reuse);
}
'''

[[obligation]]
verifier = "kani"
source = "crates/rules/src/proof_image_prepare_rules.rs"
probes = '''
use production::{Capacity, ObservedStorage, Ownership, Release, Running, Work, WORK_SECONDS, WALL_SECONDS, observed_storage, release, work};
#[kani::proof]
fn reject_work_without_a_captured_server() {
    assert!(work(0, Ownership::Uncaptured, Capacity::Admitted) == Work::Continue);
}
#[kani::proof]
fn reject_work_after_the_owned_identity_changes() {
    assert!(work(0, Ownership::Changed, Capacity::Admitted) == Work::Continue);
}
#[kani::proof]
fn reject_work_with_missing_capacity() {
    assert!(work(0, Ownership::Captured, Capacity::Unmeasured) == Work::Continue);
}
#[kani::proof]
fn reject_using_the_reserved_release_interval_for_work() {
    assert!(work(WORK_SECONDS, Ownership::Captured, Capacity::Admitted) == Work::Continue);
}
#[kani::proof]
fn reject_a_foreign_stopped_server_as_an_acknowledgement() {
    assert!(release(0, Ownership::Changed, Running::No) == Release::Acknowledged);
}
#[kani::proof]
fn reject_a_running_server_at_the_total_deadline_as_released() {
    assert!(release(WALL_SECONDS, Ownership::Captured, Running::Yes) == Release::Acknowledged);
}
#[kani::proof]
fn reject_ignoring_observed_growth_or_an_unknown_capacity() {
    assert!(observed_storage(Some(10), Some(7), 1, 2) == ObservedStorage::Admitted);
    assert!(observed_storage(Some(10), None, 1, 2) == ObservedStorage::Admitted);
}
'''

