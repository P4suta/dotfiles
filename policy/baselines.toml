#:schema ../schemas/baselines.schema.json
# The deterministic metrics `just check` and `just proofs` hold exactly, so a change that moves one records the new value here.
# Wall time stays advisory, and the schema refuses any threshold on it.

[[metric]]
metric = "proved-subjects"
exact = 358

[[metric]]
metric = "probes"
exact = 578

# The three unsafe blocks and the console handler of the Win32 sites in policy/unsafe-sites.toml, and the read past a slice in the Miri fixture.
[[metric]]
metric = "unsafe-sites"
exact = 5

# The lowest text contrast, in thousandths, among the palette's text pairs.
[[metric]]
metric = "minimum-contrast"
exact = 4627
pair = "comment on bg"

# Initial instruction and heap ceilings of the merged guard, measured with Rust 1.99.0, Valgrind 3.19.0, and gungraun 0.20.0 in the pinned proof image.
# The runner refuses a measurement that exceeds its ceiling with exit status 3, and the proofs refuse an improvement until the baseline records it.
# Repeated refused-push and rewritten-message measurements varied by one instruction, so the instruction ratchet admits one instruction of improvement.
[[metric]]
metric = "ir"
bench = "scan"
exact = 1913162

[[metric]]
metric = "heap-peak"
bench = "scan"
exact = 160

[[metric]]
metric = "ir"
bench = "strip"
exact = 7291

[[metric]]
metric = "heap-peak"
bench = "strip"
exact = 663

