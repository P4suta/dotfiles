# Every tool an install source places on a profile needs a skill that declares it, or a decision here that it needs none.
# `just skills` and the skills gate of `just check` compute the inventory from mise, Homebrew, Nix, Scoop, WinGet, the modern tool table, and the setup steps.
# A skill declares its tools in its frontmatter as `metadata.tools: "TOOL@VERSION"`, and a change of that pin refuses the skill until its review.

# What each setup step installs beyond the data files, by step name.
[steps]
mise = []
runtime = ["dotfiles", "skill-ops", "pr-workflow", "dotguard", "coderabbit"]
github = ["gh"]
scoop = ["scoop"]
winget = []
nix = ["nix"]
desktop = []
tools = []
wezterm = ["wezterm"]
herdr = ["herdr"]
integrations = []
python-stub = []
keyboard = []
sshd = ["sshd"]
storage-scout = ["storage-scout"]
fcitx5 = ["fcitx5"]
macos-defaults = []
forge-keys = []
claude = ["claude"]
ocaml = ["opam"]
haskell = ["cabal"]
racket = ["raco"]
guard = ["dotguard", "reaper", "herdr-agent", "dev-reaper", "session-reaper"]
ocomment = ["ocomment"]
domyjob = ["domyjob"]
fleet = ["fleet"]
retire-tmux = []
upgrade = []
chat = []
adapters = []

# Tools that exist on only some platforms, so a skill for one installs only there.
[platform_specific]
orbstack = ["mac"]

# Tools that need no skill, grouped by a reason from a closed set: self-describing, toolchain, library, desktop, modern-table, or guarded.

[[none]]
reason = "modern-table"
why = "The modern tool table names when each tool replaces a legacy one, when the legacy tool stays correct, and the next action, so the hook carries the judgment."
