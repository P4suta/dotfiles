# The cargo-fuzz targets of every parser the shape catalog finds in this repository, which `just proofs` replays over each committed corpus.
# libFuzzer builds only on a nightly toolchain, so the targets keep their own workspace outside the stable one.
[package]
name = "dotfiles-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0"
coderabbit-guard = { path = "../crates/coderabbit-guard" }
dotfiles = { version = "0.1.0", path = "../crates/dotfiles" }
dotguard = { path = "../crates/dotguard" }
flate2 = "1.1.10"
libfuzzer-sys = "0.4.13"
model = { path = "../crates/model" }
platform = { path = "../crates/platform" }
rules = { path = "../crates/rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tar = { version = "0.4.46", default-features = false }
toml = "1.0"
xtask = { path = "../xtask" }

[[bin]]
name = "artifact_plan"
path = "fuzz_targets/artifact_plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact_materials"
path = "fuzz_targets/artifact_materials.rs"
test = false
doc = false
bench = false

[[bin]]
name = "color_literal"
path = "fuzz_targets/color_literal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chezmoi_data"
path = "fuzz_targets/chezmoi_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gate_list"
path = "fuzz_targets/gate_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "language_mode"
path = "fuzz_targets/language_mode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opencode_permissions"
path = "fuzz_targets/opencode_permissions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refusal_line"
path = "fuzz_targets/refusal_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_path_response"
path = "fuzz_targets/native_path_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repository_metadata"
path = "fuzz_targets/repository_metadata.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "renovate_report"
path = "fuzz_targets/renovate_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "review_completion"
path = "fuzz_targets/review_completion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_image_server"
path = "fuzz_targets/proof_image_server.rs"
test = false
doc = false
bench = false
