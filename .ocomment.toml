# Repeats `home/dot_config/ocomment/config.toml`, which a CI runner lacks.
version = 1

# Remove nothing.
[policy]
mode = "none"

# One sentence per line.
[style]
wrap = "sentence"

# Vendored Vale packages keep their upstream text.
[files]
exclude = ["home/dot_config/prose/styles/**"]

# Source names hide the format behind `dot_` and `.tmpl`, so these overrides name it.
# Only the prose partials hold Markdown.
# The profile leaves hold configuration that a reflow would corrupt.
[[overrides]]
paths = [
  "**/*.md.tmpl",
  "home/.chezmoitemplates/agent_policy",
  "home/.chezmoitemplates/prose_policy",
  "home/.chezmoitemplates/remote_machines",
  "home/.chezmoitemplates/signing_pubkey",
]
language = "markdown"

[[overrides]]
paths = ["**/*.toml.tmpl", "home/dot_config/git/config.tmpl"]
language = "toml"

[[overrides]]
paths = ["**/*.yml.tmpl"]
language = "yaml"

[[overrides]]
paths = ["**/*.json.tmpl"]
language = "jsonc"

[[overrides]]
paths = ["**/*.lua.tmpl"]
language = "lua"

[[overrides]]
paths = [
  "home/dot_config/dev-reaper/config.tmpl",
  "home/dot_config/session-reaper/config.tmpl",
  "home/.chezmoitemplates/profiles/mac/dot_config/dev-reaper/config",
  "home/.chezmoitemplates/profiles/mac/dot_config/session-reaper/config",
  "home/.chezmoitemplates/profiles/linux/dot_config/dev-reaper/config",
  "home/.chezmoitemplates/profiles/linux/dot_config/session-reaper/config",
]
language = "toml"

# These files share only shell comment and string syntax.
[[overrides]]
paths = [
  "home/dot_bashrc.tmpl",
  "home/dot_profile.tmpl",
  "home/.chezmoitemplates/profiles/linux/dot_bashrc.tmpl",
  "home/.chezmoitemplates/profiles/linux/dot_profile.tmpl",
  "home/.chezmoitemplates/profiles/mac/dot_bashrc",
  "home/.chezmoitemplates/profiles/mac/dot_zprofile.tmpl",
  "home/.chezmoitemplates/profiles/mac/dot_zshrc.tmpl",
  "home/.chezmoitemplates/profiles/wsl/dot_bashrc.tmpl",
  "**/*.sh.tmpl",
  "**/*.nu",
  "**/*.nu.tmpl",
  "justfile",
]
language = "shell"

# In pattern lists, `#` opens a comment only at the start of a line.
[profiles.chezmoi-list]
name = "chezmoi-list"
filenames = [".chezmoiignore", ".chezmoiremove"]
line_comments = [{ start = "#", requires_line_start = true, kind = "line" }]
