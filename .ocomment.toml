# This repository's gate repeats the two settings of `dot_config/ocomment/config.toml`, because a continuous integration runner has no `~/.config/ocomment`.
version = 1

# Remove nothing.
[policy]
mode = "none"

# One sentence per line.
[style]
wrap = "sentence"

# Vendored Vale packages keep their upstream text.
[files]
exclude = ["dot_config/prose/styles/**"]

# Chezmoi source names hide the format behind `dot_` and `.tmpl`, so these overrides name it.
# Only the prose partials hold Markdown.
# The profile leaves under `.chezmoitemplates/profiles/` hold configuration that a sentence reflow would corrupt.
[[overrides]]
paths = [
  "**/*.md.tmpl",
  ".chezmoitemplates/agent_policy",
  ".chezmoitemplates/prose_policy",
  ".chezmoitemplates/remote_machines",
  ".chezmoitemplates/signing_pubkey",
]
language = "markdown"

[[overrides]]
paths = ["**/*.toml.tmpl", "dot_gitconfig.tmpl"]
language = "toml"

[[overrides]]
paths = ["**/*.yml.tmpl"]
language = "yaml"

[[overrides]]
paths = ["**/*.json.tmpl"]
language = "jsonc"

[[overrides]]
paths = ["**/*.lua.tmpl"]
language = "lua"

[[overrides]]
paths = [
  "dot_config/dev-reaper/config.tmpl",
  "dot_config/session-reaper/config.tmpl",
  ".chezmoitemplates/profiles/mac/dot_config/dev-reaper/config",
  ".chezmoitemplates/profiles/mac/dot_config/session-reaper/config",
  ".chezmoitemplates/profiles/linux/dot_config/dev-reaper/config",
  ".chezmoitemplates/profiles/linux/dot_config/session-reaper/config",
]
language = "toml"

# These files share only shell comment and string syntax, which suffices for the prose rules.
[[overrides]]
paths = [
  "dot_bashrc.tmpl",
  "dot_profile.tmpl",
  ".chezmoitemplates/profiles/linux/dot_bashrc.tmpl",
  ".chezmoitemplates/profiles/linux/dot_profile.tmpl",
  ".chezmoitemplates/profiles/mac/dot_bashrc",
  ".chezmoitemplates/profiles/mac/dot_zprofile.tmpl",
  ".chezmoitemplates/profiles/mac/dot_zshrc.tmpl",
  ".chezmoitemplates/profiles/wsl/dot_bashrc.tmpl",
  "**/*.sh.tmpl",
  "**/*.nu",
  "**/*.nu.tmpl",
  "justfile",
]
language = "shell"

# In pattern lists, `#` opens a comment only at the start of a line, as in the built-in `hash-line` profile.
[profiles.chezmoi-list]
name = "chezmoi-list"
filenames = [".chezmoiignore", ".chezmoiremove"]
line_comments = [{ start = "#", requires_line_start = true, kind = "line" }]
