[package]
name = "dotctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command layer for these dotfiles: lint, apply, git hooks, machine setup"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2.37"
junction = "2.0.0"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[dev-dependencies]
tempfile = "3"
