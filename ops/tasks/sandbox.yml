---
# Prerequisites for the Claude Code sandbox, which isolates processes with bubblewrap.
#
# The sandbox also needs ripgrep, which mise supplies through `tools.common` in .chezmoidata.toml.
# An apt copy would lose to the mise copy on PATH.
# The kernel supplies the seccomp filter, so this file asserts it instead of installing it.

- name: Install sandbox prerequisites (bubblewrap + socat)
  become: true
  ansible.builtin.apt:
    name:
      - bubblewrap  # bwrap: builds the mount/pid/net namespaces
      - socat       # relays the sandbox socket outward
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Stat seccomp actions_avail
  ansible.builtin.stat:
    path: /proc/sys/kernel/seccomp/actions_avail
  register: sandbox_seccomp

# Present only when CONFIG_SECCOMP_FILTER=y.
# Without it, bwrap has no syscall filter, and only a different kernel makes the sandbox usable.
- name: Confirm the kernel supports seccomp filter
  ansible.builtin.assert:
    that: sandbox_seccomp.stat.exists
    fail_msg: This kernel lacks seccomp filter (CONFIG_SECCOMP_FILTER); the sandbox cannot run.
    success_msg: seccomp filter available
