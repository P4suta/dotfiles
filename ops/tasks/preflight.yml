---
# Mint trap: VERSION_CODENAME=zena is Mint-specific and 404s against the Docker and Tailscale apt repos, so resolve UBUNTU_CODENAME=noble instead.
# ansible_facts.lsb.codename returns zena, hence reading /etc/os-release directly.

- name: Read /etc/os-release
  ansible.builtin.slurp:
    src: /etc/os-release
  register: osr_content

- name: Resolve Ubuntu codename (UBUNTU_CODENAME or VERSION_CODENAME)
  ansible.builtin.set_fact:
    ubuntu_codename: >-
      {{
        (osr_content.content | b64decode
          | regex_search('UBUNTU_CODENAME=(\S+)', '\1'))[0]
        | default(
            (osr_content.content | b64decode
              | regex_search('VERSION_CODENAME=(\S+)', '\1'))[0],
            true)
      }}

- name: Resolve apt arch (amd64 / arm64)
  ansible.builtin.set_fact:
    apt_arch: "{{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"

- name: Show resolved facts
  ansible.builtin.debug:
    msg: "ubuntu_codename={{ ubuntu_codename }} apt_arch={{ apt_arch }}"
