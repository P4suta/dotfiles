---
# KVM/QEMU + libvirt (qemu:///system), including OVMF and swtpm for Windows 11 guests.
# Everything comes from noble main/universe, so there is no third-party repo and no dependency on the preflight facts.

- name: Install KVM / QEMU + libvirt + virt-manager
  become: true
  ansible.builtin.apt:
    name:
      - qemu-system-x86       # KVM/QEMU x86 hypervisor
      - qemu-utils            # qemu-img
      - libvirt-daemon-system
      - libvirt-clients       # virsh
      - virtinst              # virt-install
      - virt-manager
      - ovmf                  # UEFI firmware, required by Windows 11
      - swtpm                 # software TPM
      - swtpm-tools           # swtpm_setup, used by libvirt to start TPM 2.0
    state: present
    update_cache: true

- name: Enable libvirtd.service
  become: true
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Add workspace user to libvirt and kvm groups
  become: true
  ansible.builtin.user:
    name: "{{ workspace_user }}"
    groups: libvirt,kvm
    append: true
