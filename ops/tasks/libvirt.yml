---
# Libvirt on `qemu:///system`, with `ovmf` and `swtpm` for Windows 11 guests.
# All packages come from noble main and universe, so this file needs no third-party repository or preflight facts.

- name: Install KVM / QEMU + libvirt + virt-manager
  become: true
  ansible.builtin.apt:
    name:
      - qemu-system-x86       # x86 hypervisor
      - qemu-utils            # qemu-img
      - libvirt-daemon-system
      - libvirt-clients       # virsh
      - virtinst              # virt-install
      - virt-manager
      - ovmf                  # firmware that Windows 11 requires
      - swtpm                 # software Trusted Platform Module
      - swtpm-tools           # swtpm_setup, which libvirt runs to start the emulated module
    state: present
    update_cache: true

- name: Enable libvirtd.service
  become: true
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Add workspace user to libvirt and kvm groups
  become: true
  ansible.builtin.user:
    name: "{{ workspace_user }}"
    groups: libvirt,kvm
    append: true
