---
# KVM, QEMU, and libvirt for Windows 11 guests on `qemu:///system`.
# OVMF and swtpm supply the UEFI firmware and TPM 2.0.

- name: Install KVM / QEMU + libvirt + virt-manager
  become: true
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - virt-manager
      - ovmf
      - swtpm
      - swtpm-tools
    state: present
    update_cache: true

- name: Enable libvirtd.service
  become: true
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Add workspace user to libvirt and kvm groups
  become: true
  ansible.builtin.user:
    name: "{{ workspace_user }}"
    groups: libvirt,kvm
    append: true
