---
pre-commit:
  commands:
    staged:
      run: mise x -- just check-staged
commit-msg:
  commands:
    prose:
      run: mise x -- just commit-message {1}
pre-push:
  commands:
    hosts:
      use_stdin: true
      run: mise x -- just hosts gate {1} {2}
    check:
      run: mise x -- just check --base origin/main
    proofs:
      run: mise x -- just proofs --base origin/main
