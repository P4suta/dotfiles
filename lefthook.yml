---
pre-commit:
  commands:
    candidate:
      run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- check --staged
pre-push:
  commands:
    hosts:
      use_stdin: true
      run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- hosts gate {1} {2}
    candidate:
      run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- check --base origin/main
    contracts:
      run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- proofs --base origin/main
