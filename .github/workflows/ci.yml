name: ci

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kani installs only in the proofs job, which clears this list.
  MISE_DISABLE_TOOLS: "cargo:kani-verifier"
  # Every managed host runs mise in paranoid mode, which loads a project configuration only once it trusts that exact file.
  MISE_PARANOID: "1"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/mise.toml

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      gates: ${{ steps.classify.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - name: Select the gates this change affects
        id: classify
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: mise x -- just classify --base "$BASE" >> "$GITHUB_OUTPUT"

  # The ruleset still requires these matrix contexts.
  # Until it requires only the required job, this job keeps their names and always reports, with each step gated instead.
  check:
    name: required (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GATES: ${{ needs.classify.outputs.gates }}
    steps:
      - name: Refuse to pass without a classification
        if: needs.classify.result != 'success'
        shell: bash
        run: |
          echo "the classify job did not succeed, so no gate was selected" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GATES != ''
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        if: env.GATES != ''
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.GATES != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check the selected gates
        if: env.GATES != ''
        shell: bash
        run: mise x -- just check --gates "$GATES"
      - name: Check Linux system provisioning syntax
        if: runner.os == 'Linux' && contains(needs.classify.outputs.gates, 'profiles')
        run: mise x -- just ops-check

  proofs:
    name: proofs
    needs: classify
    if: contains(needs.classify.outputs.gates, 'rust')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_DISABLE_TOOLS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.kani
            target
          key: proofs-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: proofs-
      - name: Set up the pinned verifier
        run: mise x -- kani setup
      - name: Prove the production contracts and reject the counterexamples
        run: mise x -- just proofs

  minimum-git:
    # Git 2.43 comes from Ubuntu 24.04 and ranks as the oldest Git on a managed host.
    # The guard reads the Git state through it.
    # The runner builds the tests, and an Ubuntu 24.04 container with the same C library runs them with its own Git.
    name: guard (Git 2.43)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install_args: rust
      - name: Build the guard tests
        run: |
          mise x -- cargo test --locked --package dotguard --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > guard-tests.txt
          test -s guard-tests.txt
      - name: Run the guard tests on Git 2.43
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE/crates/dotguard" \
            ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 \
            bash -euc 'apt-get update -qq && apt-get install --yes --no-install-recommends -qq git openssh-client > /dev/null
              git --version | grep -Fx "git version 2.43.0"
              while read -r test; do "$test"; done < ../../guard-tests.txt'

  # The ruleset still requires these matrix contexts, so this job keeps their names and always reports, like the check job.
  rehearsal:
    name: rehearsal (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Refuse to pass without a classification
        if: needs.classify.result != 'success'
        shell: bash
        run: |
          echo "the classify job did not succeed, so no gate was selected" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.classify.outputs.gates, 'profiles')
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        if: contains(needs.classify.outputs.gates, 'profiles')
      - name: Apply, reprovision, and reapply the native profile on this disposable host
        if: contains(needs.classify.outputs.gates, 'profiles')
        run: mise x -- just rehearse --disposable-host

  # The wsl profile rehearses inside a fresh WSL distribution on a disposable Windows host.
  rehearsal-wsl:
    name: rehearsal (wsl)
    needs: classify
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # WSL receives only the variables that WSLENV names.
      WSLENV: CI:MISE_DISABLE_TOOLS:MISE_PARANOID
    steps:
      - name: Refuse to pass without a classification
        if: needs.classify.result != 'success'
        shell: bash
        run: |
          echo "the classify job did not succeed, so no gate was selected" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.classify.outputs.gates, 'profiles')
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        if: contains(needs.classify.outputs.gates, 'profiles')
        with:
          distribution: Ubuntu-24.04
          additional-packages: build-essential ca-certificates curl git
      - name: Install the pinned mise release in WSL
        if: contains(needs.classify.outputs.gates, 'profiles')
        shell: wsl-bash {0}
        run: |
          set -eu
          version=$(sed -n '/^\[mise\]$/,/^\[/s/^version = "\(.*\)"$/\1/p' home/.chezmoidata/versions.toml)
          digest=$(sed -n 's/^linux-x64 = "\(.*\)"$/\1/p' home/.chezmoidata/versions.toml)
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error --output "$HOME/.local/bin/mise" \
            "https://github.com/jdx/mise/releases/download/v$version/mise-v$version-linux-x64"
          echo "$digest  $HOME/.local/bin/mise" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/mise"
      - name: Apply, reprovision, and reapply the native profile in this disposable distribution
        if: contains(needs.classify.outputs.gates, 'profiles')
        shell: wsl-bash {0}
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          mise trust "$PWD/mise.toml"
          mise install
          mise x -- just rehearse --disposable-host

  # The one status the ruleset requires.
  # A job that the change skips counts as passed, and a failed or cancelled one fails this job.
  required:
    name: required
    needs: [classify, check, proofs, minimum-git, rehearsal, rehearsal-wsl]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a failed or cancelled job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a required job ended as $result" >&2; exit 1 ;;
            esac
          done
