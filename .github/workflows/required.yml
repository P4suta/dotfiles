---
name: required

on:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      gates: ${{ steps.classify.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - name: Select the gates this change affects
        id: classify
        env:
          BASE: origin/${{ github.base_ref }}
        run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- classify --base "$BASE" >> "$GITHUB_OUTPUT"

  # The required checks always run and report, so a change that needs fewer gates still satisfies the ruleset.
  # Each step runs only for the gates the classify job selected, and a skipped step counts as a success.
  required:
    name: required (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GATES: ${{ needs.classify.outputs.gates }}
    steps:
      - name: Refuse to pass without a classification
        if: needs.classify.result != 'success'
        shell: bash
        run: |
          echo "the classify job did not succeed, so no gate was selected" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify.outputs.gates != ''
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        if: needs.classify.outputs.gates != ''
      - name: Check the selected gates
        if: needs.classify.outputs.gates != ''
        shell: bash
        run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- check --gates "$GATES"
      - name: Set up the pinned native verifier
        if: runner.os == 'macOS' && contains(needs.classify.outputs.gates, 'rust')
        run: mise x -- kani setup
      - name: Prove production maintenance contracts and reject the counterexample
        if: runner.os == 'macOS' && contains(needs.classify.outputs.gates, 'rust')
        run: mise run check:proofs
      - name: Check Linux system provisioning syntax
        if: runner.os == 'Linux' && contains(needs.classify.outputs.gates, 'profiles')
        run: mise run check:ops

  minimum-git:
    # Git 2.43 comes from Ubuntu 24.04 and ranks as the oldest Git on a managed host.
    # The guard reads the Git state through it.
    # The runner builds the tests, and an Ubuntu 24.04 container with the same C library runs them with its own Git.
    name: guard (Git 2.43)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install_args: rust
      - name: Build the guard tests
        run: |
          mise x -- cargo test --locked --manifest-path guard/Cargo.toml --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > guard-tests.txt
          test -s guard-tests.txt
      - name: Run the guard tests on Git 2.43
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE/guard" \
            ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55 \
            bash -euc 'apt-get update -qq && apt-get install --yes --no-install-recommends -qq git openssh-client > /dev/null
              git --version | grep -Fx "git version 2.43.0"
              while read -r test; do "$test"; done < ../guard-tests.txt'

  rehearsal:
    name: rehearsal (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Refuse to pass without a classification
        if: needs.classify.result != 'success'
        shell: bash
        run: |
          echo "the classify job did not succeed, so no gate was selected" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.classify.outputs.gates, 'profiles')
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        if: contains(needs.classify.outputs.gates, 'profiles')
      - name: Apply, reprovision, and reapply the native profile on this disposable host
        if: contains(needs.classify.outputs.gates, 'profiles')
        run: mise x -- cargo run --locked --manifest-path xtask/Cargo.toml -- rehearse --disposable-host
