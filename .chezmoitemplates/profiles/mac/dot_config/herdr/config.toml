# Herdr owns interactive terminal sessions; Bash remains the OS login shell.
onboarding = false

[terminal]
default_shell = "nu"
shell_mode = "non_login"
new_cwd = "follow"

[worktrees]
directory = "~/.local/share/herdr/worktrees"

[theme]
name = "tokyo-night"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true
