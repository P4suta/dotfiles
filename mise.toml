[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
python = "3.14.10"
bun = "1.4.4"
chezmoi = "2.73.3"
uv = "0.13.5"
just = "1.59.0"
gh = "2.103.2"
docker-cli = "29.9.2"
"aqua:docker/buildx" = "0.38.1"
taplo = "0.10.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
ruff = "0.17.2"
biome = "2.6.2"
hadolint = "2.15.1"
gitleaks = "8.30.1"
typos = "1.51.1"
yamllint = "1.38.0"
nu = "0.116.1"
powershell = "7.6.9"
"conda:zsh" = { version = "5.9.2", channel = "conda-forge", os = ["linux"] }
"pypi:ansible-core" = { version = "2.21.5", os = ["linux"] }
"cargo:kani-verifier" = { version = "0.68.0", os = ["macos", "linux"] }
"cargo:cargo-mutants" = { version = "27.1.0", os = ["macos", "linux"] }
"cargo:cargo-fuzz" = { version = "0.13.2", os = ["macos", "linux"] }
"cargo:gungraun-runner" = { version = "0.20.0", os = ["linux"] }
"github:github/gh-stack" = { version = "v0.2.1", bin = "gh-stack" }
"cargo:https://github.com/P4suta/OComment" = { version = "rev:552c8d0c340d25bc0557ba8988eaa231a67408d0", crate = "ocomment", locked = true }
vale = "3.25.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
cargo-deny = "0.20.2"
ast-grep = "0.51.0"
# The theme gate renders the prompt and the pager at these releases, so every host draws the same cell grids.
starship = "1.27.0"
bat = "0.26.1"
# The startup gate fills its caches with the same initialization generators on every host.
atuin = { version = "18.24.2", libc = "musl" }
television = { version = "0.15.9", libc = "musl" }
zoxide = "0.10.0"
vivid = "0.11.1"
fzf = "0.74.5"
rg = "15.2.0"
fd = "10.5.0"
sd = "1.1.0"
choose = "1.3.7"
eza = "0.23.5"
dust = "1.2.6"
"github:Canop/dysk" = { version = "3.8.1", version_prefix = "v" }
"aqua:dalance/procs" = "0.14.12"
bottom = "0.14.9"
difftastic = "0.71.0"
jaq = "3.1.2"
jq = "1.8.2"
xh = "0.26.3"
hexyl = "0.17.0"
tokei = "15.0.0"
hyperfine = "1.21.0"
tealdeer = "v1.9.1"
"github:ouch-org/ouch" = "0.8.3"
qsv = "24.0.0"
yq = "4.54.1"
delta = "0.20.1"

[settings]
activate_aggressive = true
# mise.lock records each tool's version, download URL, and checksum for every host platform.
lockfile = true

[settings.github]
gh_cli_tokens = true
