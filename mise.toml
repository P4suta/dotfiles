[tools]
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
python = "3.14.8"
bun = "1.4.2"
chezmoi = "2.73.0"
uv = "0.12.22"
just = "1.58.0"
gh = "2.102.0"
docker-cli = "29.9.0"
taplo = "0.10.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
typos = "1.50.3"
yamllint = "1.38.0"
nu = "0.116.0"
powershell = "7.6.6"
"conda:zsh" = { version = "5.9", channel = "conda-forge", os = ["linux"] }
"pypi:ansible-core" = { version = "2.21.4", os = ["linux"] }
"cargo:kani-verifier" = { version = "0.68.0", os = ["macos", "linux"] }
"cargo:cargo-mutants" = { version = "27.1.0", os = ["macos", "linux"] }
"cargo:cargo-fuzz" = { version = "0.13.2", os = ["macos", "linux"] }
"cargo:gungraun-runner" = { version = "0.20.0", os = ["linux"] }
"github:github/gh-stack" = { version = "0.2.0", bin = "gh-stack" }
"cargo:https://github.com/P4suta/OComment" = { version = "rev:f8dbfbb67fc7178aa22a44f572d332b7d9b17d0d", crate = "ocomment", locked = true }
vale = "3.24.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
cargo-deny = "0.20.2"
ast-grep = "0.45.3"
# The theme gate renders the prompt and the pager at these releases, so every host draws the same cell grids.
starship = "1.26.0"
bat = "0.26.1"
# The startup gate fills its caches with the same initialization generators on every host.
atuin = { version = "18.23.0", libc = "musl" }
television = { version = "0.15.9", libc = "musl" }
zoxide = "0.10.0"
vivid = "0.11.1"
fzf = "0.74.4"
rg = "15.2.0"
fd = "10.5.0"
sd = "1.1.0"
choose = "1.3.7"
eza = "0.23.5"
dust = "1.2.6"
"github:Canop/dysk" = "3.7.1"
"aqua:dalance/procs" = "0.14.12"
bottom = "0.14.9"
difftastic = "0.71.0"
jaq = "3.1.1"
jq = "1.8.2"
xh = "0.26.2"
hexyl = "0.17.0"
tokei = "15.0.0"
hyperfine = "1.21.0"
tealdeer = "1.9.0"
"github:ouch-org/ouch" = "0.8.3"
qsv = "24.0.0"
yq = "4.54.1"
delta = "0.20.1"

[settings]
activate_aggressive = true
# mise.lock records each tool's version, download URL, and checksum for every host platform.
lockfile = true

[settings.github]
gh_cli_tokens = true
