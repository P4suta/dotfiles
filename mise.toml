[tools]
rust = { version = "1.99.0", components = ["clippy", "rustfmt"] }
bun = "1.4.2"
chezmoi = "2.73.0"
uv = "0.12.22"
just = "1.58.0"
taplo = "0.10.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
typos = "1.50.3"
yamllint = "1.38.0"
nu = "0.116.0"
powershell = "7.6.6"
"pypi:ansible-core" = { version = "2.21.4", os = ["linux"] }
"cargo:kani-verifier" = { version = "0.68.0", os = ["macos", "linux"] }
"cargo:cargo-mutants" = { version = "27.1.0", os = ["macos", "linux"] }
"github:github/gh-stack" = { version = "0.2.0", bin = "gh-stack" }
vale = "3.24.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
cargo-deny = "0.20.2"
ast-grep = "0.45.3"

[settings]
# mise.lock records each tool's version, download URL, and checksum for every host platform.
lockfile = true
