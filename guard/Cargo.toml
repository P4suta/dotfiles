[package]
name = "dotguard"
version = "0.1.0"
edition = "2024"
# ocomment-core requires this MSRV, and guard shares its toolchain.
rust-version = "1.88"
description = "Local policy gate: refuses destructive git operations, foreign-script contamination and agent attribution"
license = "MIT"
publish = false

# The prose gate runs the ocomment binary, configured in `dot_config/ocomment/config.toml`.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
