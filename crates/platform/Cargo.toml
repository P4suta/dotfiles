[package]
name = "platform"
description = "The host facts and the one process constructor that every dotfiles crate shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The Git guard starts on every Git command and needs only the home, the PATH, the process constructor, and the refusal format, so it turns the tools feature off.
[features]
default = ["tools"]
pty = ["dep:portable-pty"]
tools = [
  "dep:anyhow",
  "dep:clap",
  "dep:model",
  "dep:serde",
  "dep:serde_json",
  "dep:tempfile",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
model = { path = "../model", optional = true }
portable-pty = { version = "0.9.0", optional = true }
rules = { path = "../rules" }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.11.0" }
tempfile = { version = "3.27", optional = true }

[build-dependencies]
sha2 = { version = "0.11.0" }

[lints]
workspace = true
