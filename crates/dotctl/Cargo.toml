[package]
name = "dotctl"
description = "Windows machine setup for these dotfiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2.37"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# The workspace forbids unsafe code, which no #[expect] can lift.
# The keyboard settings make the foreign calls here, and policy/unsafe-sites.toml lists them, so this table repeats the workspace lints with unsafe code denied.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
