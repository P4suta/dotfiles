[package]
name = "dotctl"
description = "Windows machine setup for these dotfiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2.37"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
