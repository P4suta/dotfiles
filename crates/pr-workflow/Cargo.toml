[package]
name = "pr-workflow"
description = "The checked pull request workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pr-workflow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
coderabbit-guard = { path = "../coderabbit-guard" }
dotfiles = { path = "../dotfiles" }
dotguard = { path = "../dotguard" }
platform = { path = "../platform" }
prose = { path = "../prose" }
pulldown-cmark = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
skill-ops = { path = "../skill-ops" }
tempfile = "3.27"

[lints]
workspace = true
